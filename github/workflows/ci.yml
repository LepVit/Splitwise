name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Splitwise.slnx

      - name: Build
        run: dotnet build Splitwise.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Splitwise.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Docker build
        run: docker build --tag splitwise-api:${{ github.sha }} .

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook (Render)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret DEPLOY_HOOK_URL is not set, deploy skipped."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
